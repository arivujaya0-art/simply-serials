<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard – Simply Serials</title><link href="https://fonts.googleapis.com/css2?family=Hind+Madurai:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">▶</span><span>Simply<span>Serials</span><small>Admin dashboard</small></span></a><div class="header-actions"><a class="admin-link" href="index.html">← View Website</a></div></header><main class="page-shell"><div id="loginView" class="form-card"><h1>Admin Login</h1><p>Sign in with the administrator account created in Firebase Authentication.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="admin@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password"></div><button class="form-button" id="loginBtn">Sign In</button><div id="loginMessage" class="notice hidden"></div></div>
<div id="dashboardView" class="hidden-section"><div class="admin-top" style="margin:24px 0"><div><span class="eyebrow">SIMPLY SERIALS CONTROL ROOM</span><h1 style="margin:4px 0">Admin Dashboard</h1><p id="signedInAs" class="serial-meta"></p></div><button class="form-button secondary" id="logoutBtn">Sign out</button></div><div class="admin-layout"><aside class="admin-side"><button class="active" data-tab="serialsTab">Manage Serials</button><button data-tab="episodesTab">Manage Episodes</button></aside><section class="admin-content">
<div id="serialsTab"><h2>Serials</h2><form id="serialForm"><input type="hidden" id="serialId"><div class="field"><label>Serial title *</label><input id="serialTitle" required placeholder="e.g. சிங்கப்பெண்ணே"></div><div class="field"><label>Channel *</label><select id="serialChannel" required><option>Sun TV</option><option>Vijay TV</option><option>Zee Tamil</option><option>Colors Tamil</option><option>Other</option></select></div><div class="field"><label>Poster image URL</label><input id="serialPoster" type="url" placeholder="https://..."></div><div class="field"><label>Description</label><textarea id="serialDescription" placeholder="Short serial description"></textarea></div><button class="form-button" type="submit">Save Serial</button> <button class="form-button secondary" type="button" id="clearSerial">Clear</button></form><div id="serialAdminList" class="admin-list"></div></div>
<div id="episodesTab" class="hidden-section"><h2>Episodes</h2><form id="episodeForm"><input type="hidden" id="episodeId"><div class="field"><label>Serial *</label><select id="episodeSerial" required></select></div><div class="field"><label>Episode number *</label><input id="episodeNumber" required placeholder="1463"></div><div class="field"><label>Episode title / note</label><input id="episodeTitle" placeholder="Today's episode"></div><div class="field"><label>YouTube video URL (optional)</label><input id="youtubeUrl" type="url" placeholder="https://www.youtube.com/watch?v=..."></div><div class="field"><label>Official viewing URL (optional)</label><input id="officialUrl" type="url" placeholder="Official broadcaster episode link"></div><div class="field"><label>Thumbnail image URL (optional)</label><input id="episodeThumbnail" type="url" placeholder="https://..."></div><button class="form-button" type="submit">Save Episode</button> <button class="form-button secondary" type="button" id="clearEpisode">Clear</button></form><div id="episodeAdminList" class="admin-list"></div></div>
</section></div><div id="adminMessage" class="notice hidden"></div></div></main><footer class="site-footer"><p>Admin access is protected by Firebase Authentication and Firestore rules.</p></footer><script type="module" src="admin.js"></script></body></html>
